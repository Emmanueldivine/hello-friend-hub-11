<style>
:root{--navy:#0a1931;--yellow:#ffd700;--yellow2:#ffcf33;--ink:#0a1931;--paper:#f8fafc;--line:#e2e8f0}
*{box-sizing:border-box}
/* ===== EDGE-TO-EDGE MOBILE FIT: never allow horizontal scroll ===== */
html,body{width:100%;max-width:100%;overflow-x:hidden;margin:0;padding:0}
img,video,iframe{max-width:100%;height:auto}
main,section,header,footer{max-width:100vw}
.min-w-0{min-width:0}
html,body{background:var(--paper)}
body{margin:0;color:var(--ink);font-family:Poppins,"Segoe UI",Roboto,Arial,"DejaVu Sans","Noto Sans",sans-serif}
.field{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:.8rem 1rem;outline:0}
.field:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(255,215,0,.2)}
.btn{border:0;border-radius:12px;background:var(--yellow);color:var(--navy);cursor:pointer;font-weight:700;padding:.8rem 1rem}
.btn:disabled{opacity:.7;cursor:not-allowed}
.toast{position:fixed;right:18px;bottom:18px;z-index:80;border-radius:12px;background:var(--navy);color:#fff;padding:.8rem 1rem;max-width:90vw}
.hide{display:none!important}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(10,25,49,.3);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-in{animation:fadeUp .25s ease}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
.typing-dot{display:inline-block;width:6px;height:6px;margin:0 1px;border-radius:50%;background:#94a3b8;animation:blink 1.2s infinite both}
.typing-dot:nth-child(2){animation-delay:.2s}.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
/* ============ DARK THEME ONLY ============ */

<script>
(() => {
const $=(s,r=document)=>r.querySelector(s),
$$=(s,r=document)=>Array.from(r.querySelectorAll(s)),
read=(k,d)=>{try{const u=(()=>{try{return JSON.parse(localStorage.getItem('currentUser')||'null')}catch{return null}})();const id=u?.phone||u?.phoneNumber||u?.username;const storageKey=id&&['assignments','messages','chats','history'].includes(k)?`${k}_${id}`:k;const v=localStorage.getItem(storageKey);return v===null?d:(JSON.parse(v)??d)}catch{return d}},
write=(k,v)=>{const u=(()=>{try{return JSON.parse(localStorage.getItem('currentUser')||'null')}catch{return null}})();const id=u?.phone||u?.phoneNumber||u?.username;const storageKey=id&&['assignments','messages','chats','history'].includes(k)?`${k}_${id}`:k;localStorage.setItem(storageKey,JSON.stringify(v));};
const app=$('#app');
const WA='2348000000000';
const SUPPORT_EMAIL='support@unieveryhelp.com';
const users=()=>read('users',[]), items=()=>read('assignments',[]), user=()=>read('currentUser',null),
ranges=['1–10','11–20','21–30','31–40','41–60','61–90','91+'];

/* ---------- pricing (Cheap Text Work starts from ₦600) ---------- */
const prices={
cheap:{'24':[1500,2500,3500,4500,5500,7000,9000],'48':[1000,1800,2600,3400,4200,5500,7000],'72':[600,1000,1600,2200,2800,3800,5000]},
technical:{'24':[3000,5000,7000,9000,11000,14000,18000],'48':[2000,3500,5000,6500,8000,10500,13000],'72':[1500,2500,3500,4500,5500,7000,9000]}
};

const money=n=>n==null?'Staff quote':'₦'+Number(n).toLocaleString('en-NG'),
amount=(track,pages,hours)=>prices[track][hours][Math.min(Math.max(Number(pages)||1,1),7)-1];
const path=()=>((location.hash.replace(/^#/,'')||'/').split('?')[0]||'/'),
esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),
go=p=>{document.documentElement.style.overflow='';document.body.style.overflow='';location.hash=p;render();scrollTo(0,0)},
toast=t=>{const n=$('#toast');n.textContent=t;n.classList.remove('hide');setTimeout(()=>n.classList.add('hide'),2500)};

/* ---------- per-user helpers (keyed by phone) ---------- */
const uid=()=>{const u=user()||read('unieveryhelp_user',null);return u?.phone||u?.phoneNumber||'guest';};
const getBal=()=>{const u=user()||{};return Number(read('unieveryhelp_wallet',read('wallet_'+uid(),u.wallet||0)))||0;};
const setBal=v=>{const n=Number(v)||0;write('unieveryhelp_wallet',n);write('wallet_'+uid(),n);const u=user();if(u){const updated={...u,wallet:n};write('currentUser',updated);if(read('unieveryhelp_user',null))write('unieveryhelp_user',updated);}};
const getAcct=()=>{let a=read('paga_'+uid(),null);if(!a){a='30'+(Math.random()<.5?'0':'1')+String(Math.floor(Math.random()*1e7)).padStart(7,'0');write('paga_'+uid(),a);}return a;};
const getAvatar=()=>read('avatar_'+uid(),null);
const setAvatar=v=>write('avatar_'+uid(),v);
const notifs=()=>read('notif_'+uid(),[]);
const addNotif=t=>{const n=notifs();n.unshift({id:'n-'+Date.now(),text:t,time:Date.now(),read:false});write('notif_'+uid(),n);};
const unreadCount=()=>notifs().filter(n=>!n.read).length;
const roleLabel=()=>({student:'Student',admin:'Admin',staff:'Staff'}[(user()?.role||'student')]||'Student');
/* ---------- username helpers (display uses @username, never full name) ---------- */
const genUsername=u=>{let b=String(u.username||'').toLowerCase().replace(/[^a-z0-9_]/g,'');if(b.length<3)b=String(u.fullName||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12);if(b.length<3)b='user'+String(u.phone||'').slice(-4);return (b.slice(0,12)||'user');};
const uname=()=>{const u=user();return u?(u.username||genUsername(u)):'';};
const atName=()=>'@'+uname();
/* two-letter avatar initials from a username/name, e.g. "emmanuel"->"EM", "Emeka Okafor"->"EO" */
const avatarInitials=name=>{const s=String(name||'A').trim();const parts=s.split(/\s+/).filter(Boolean);if(parts.length>=2)return (parts[0][0]+parts[1][0]).toUpperCase();return s.substring(0,2).toUpperCase()||'A';};
function migrateUsernames(){const arr=users();let ch=false;arr.forEach(u=>{if(!u.username){u.username=genUsername(u);ch=true;}});if(ch)write('users',arr);const cu=user();if(cu&&!cu.username){cu.username=genUsername(cu);write('currentUser',cu);}}
const fileSize=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(1)+' MB';
const timeAgo=t=>{const s=Math.floor((Date.now()-t)/1000);if(s<60)return'just now';const m=Math.floor(s/60);if(m<60)return m+' min ago';const h=Math.floor(m/60);if(h<24)return h+' hour'+(h>1?'s':'')+' ago';return Math.floor(h/24)+' day(s) ago';};
const clock=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

/* notification setting helpers */
const nSettings=()=>read('nsettings_'+uid(),{assignments:true,messages:true,wallet:true});
const setNSettings=v=>write('nsettings_'+uid(),v);

/* admin activity log (privacy: no chat content) */
const addActivity=t=>{const a=read('admin_activity',[]);a.unshift({t,time:Date.now()});write('admin_activity',a.slice(0,200));};

/* ---------- theme (light / dark / system) ---------- */
const getTheme=()=>read('theme','light');
const systemDark=()=>false;
const effectiveDark=()=>getTheme()==='dark';
const applyTheme=()=>{document.documentElement.setAttribute('data-theme',effectiveDark()?'dark':'light');};
const setTheme=t=>{write('theme',t);applyTheme();};
window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(getTheme()==='system')applyTheme();});

/* ---------- admin logs (deleted accounts) ---------- */
const addAdminLog=(u,reason)=>{const a=read('adminLogs',[]);a.unshift({user:u,reason,date:new Date().toISOString()});write('adminLogs',a);};

/* ---------- custom courses ---------- */
const customCourses=()=>read('customCourses',[]);
const addCustomCourse=name=>{const list=customCourses();if(!list.some(c=>c.toLowerCase()===name.toLowerCase())){list.push(name);write('customCourses',list);return true;}return false;};

/* ---------- notifications (every action) ---------- */
const notify=t=>addNotif(t);

/* ---------- action-button loading effect (premium feel) ---------- */
const btnLoading=(btn,txt)=>{if(!btn)return()=>{};const html=btn.innerHTML,dis=btn.disabled;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'+txt;return()=>{btn.disabled=dis;btn.innerHTML=html;};};
/* run an action button: spinner + text, 2.4s simulated network, then callback */
const withLoading=(btn,txt,cb,ms=2400)=>{const done=btnLoading(btn,txt);setTimeout(()=>{try{cb()}finally{done()}},ms);};

/* ---------- auto-delete completed files after 5 days ---------- */
function checkAndDeleteExpiredFiles(){
const arr=read('assignments',[]);let changed=false;
arr.forEach(a=>{
const isReady=(String(a.status||'').toLowerCase()==='ready')||a.staffFile;
if(!isReady)return;
if(!a.readyAt){a.readyAt=new Date().toISOString();changed=true;}
const hasFile=a.staffFile||a.fileUrl||a.fileData||a.file;
if(!hasFile||a.isExpired)return;
const daysPassed=(Date.now()-new Date(a.readyAt).getTime())/(1000*60*60*24);
if(daysPassed>=5){
a.staffFile=null;a.staffFileName=null;a.fileUrl=null;a.fileData=null;a.fileName=null;a.file=null;
a.isExpired=true;changed=true;
const n=read('notif_'+(a.owner||uid()),[]);
n.unshift({id:'n-'+Date.now()+Math.random(),text:'Your assignment file for "'+(a.title||'assignment')+'" has been auto-cleared after 5 days to manage storage. Contact support if you need it again.',time:Date.now(),read:false});
write('notif_'+(a.owner||uid()),n);
}
});
if(changed)write('assignments',arr);
}

const staffList=()=>read('sub-admins',[]);
const initialsOf=n=>String(n||'S').trim().split(/\s+/).filter(w=>!/^(dr|mr|mrs|ms|engr|barr)\.?$/i.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'S';
const onlineState=s=>{const m=(Date.now()-(s.lastActive||0))/60000;
if(m<5)return{label:'Online now',dot:'#22c55e',badge:'text-[#16a34a]',online:true};

return{label:'Active '+timeAgo(s.lastActive||Date.now()),dot:'#94a3b8',badge:'text-[#64748b]',online:false};};

function showModal(html){
const root=$('#modal-root');
root.innerHTML=`<div class="fixed inset-0 z-[90] flex items-end justify-center bg-black/50 p-0 sm:items-center sm:p-4" data-modal-bg>
<div class="w-full max-w-md rounded-t-3xl bg-white p-6 shadow-2xl sm:rounded-3xl msg-in">${html}</div></div>`;
root.querySelector('[data-modal-bg]').addEventListener('click',e=>{if(e.target.hasAttribute('data-modal-bg'))closeModal();});
}
function closeModal(){$('#modal-root').innerHTML='';}

const FAQS=[
['How do I get started?','UniEveryHelp.com is a premium academic support platform that provides trusted assistance to university students across Nigeria and internationally. Whether you are in Nigeria, Australia, Canada, New Zealand or anywhere in the world, we connect you with verified specialists to make your academic journey easier. To get started, simply create an account, fund your wallet, and submit your task.'],
['What services do you offer?','We offer assignment help, research and project assistance, online class support, presentation design, and rewriting and plagiarism removal services across all departments and courses.'],
['How do I submit an assignment?','Log in to your dashboard, click on "New Assignment", select your course, upload your file, describe your requirements, set your deadline and budget, then submit. Our team will review it instantly.'],
['How long does it take to complete my assignment?','Delivery time depends on your selected deadline. We can deliver within 24 hours, 48 hours, or on your chosen date. We always deliver before the deadline.'],

translate-y-1/2 text-xs font-semibold text-[#64748b]">Show</button></span></label><button type="submit" id="auth-submit" class="btn w-full">${create?'Create Account':'Login'} →</button></form>${create?'':'<p class="mt-4 mx-auto max-w-[90%] text-center text-[13px] leading-5 text-[#64748b]">You will complete your school and department profile before your first order.</p>'}<p class="mt-5 text-center text-xs text-[#64748b]"><a class="font-bold text-[#0a1931] underline" href="#/${create?'login':'create-account'}">${create?'Already have an account? Login':'Create Account'}</a></p></section></div></main></div>`;
$('#fullName')?.addEventListener('input',e=>e.target.value=e.target.value.replace(/[^a-zA-Z ]/g,'').slice(0,80));
$('#phone')?.addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,11));
$('#username')?.addEventListener('input',e=>e.target.value=e.target.value.toLowerCase().replace(/[^a-z0-9_]/g,'').slice(0,12));
$('#toggle-password').onclick=()=>{const p=$('#password');p.type=p.type==='password'?'text':'password';$('#toggle-password').textContent=p.type==='password'?'Show':'Hide'};
const err=t=>$('#auth-error').innerHTML=`<p class="mt-4 rounded bg-red-50 p-3 text-xs text-red-700">${t}</p>`;
let busy=false;
$('#auth-form').onsubmit=e=>{
e.preventDefault();
if(busy) return;
const btn=$('#auth-submit');
const password=$('#password').value;
if(create){
const fullName=$('#fullName').value.trim();
const phone=$('#phone').value.trim();
const username=$('#username').value.trim().toLowerCase();
if(!/^[a-zA-Z ]{3,}$/.test(fullName)) return err('Enter full name min 3 letters');
if(!/^0\d{10}$/.test(phone)) return err('Use 11-digit number starting with 0');
if(!/^[a-z0-9_]{3,12}$/.test(username)) return err('Username must be 3-12 chars: letters, numbers or _ only');
if(password.length<6) return err('Password min 6 chars');
const all=users();
if(all.some(x=>String(x.username||'').toLowerCase()===username)) return err('That username is already taken');
if(all.some(x=>x.phone===phone)) return err('That phone number already has an account');
busy=true; btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Creating account...';
setTimeout(()=>{const newUser={fullName,username,phone,password,role:'student'};write('users',[...all,newUser]);localStorage.removeItem('currentUser');localStorage.removeItem('isLoggedIn');localStorage.removeItem('unieveryhelp_user');localStorage.removeItem('assignments');localStorage.removeItem('messages');localStorage.removeItem('chats');localStorage.removeItem('history');const notice=document.getElementById('auth-error');if(notice)notice.innerHTML='<p class="mt-4 rounded bg-emerald-50 p-3 text-xs text-emerald-700">Account created successfully, please login</p>';setTimeout(()=>auth(false),900);},1500);

if(!password) return err('Enter your password');
const isPhone=/^\d+$/.test(idRaw)||/^0/.test(idRaw);
const idLc=idRaw.toLowerCase();
const found=users().find(x=>{
const byPhone=x.phone===idRaw;
const byUser=String(x.username||'').toLowerCase()===idLc;
return (isPhone?(byPhone||byUser):(byUser||byPhone))&&x.password===password;
});
if(!found) return err('Wrong username/phone or password - User not found');
busy=true; btn.disabled=true; btn.innerHTML='<span class="spinner"></span>Signing in...';
setTimeout(async()=>{if(!found.role)found.role='student';if(!found.username)found.username=genUsername(found);write('currentUser',found);write('isLoggedIn',true);write('lastActivity',Date.now());await fetch('/api/demo-session',{method:'GET'});go('/dashboard');},1500);
}
};
}

if(n.length<6)return msg('New password must be at least 6 characters');
if(n!==c)return msg('New passwords do not match');
withLoading(e.submitter||$('#pw-form button[type=submit]'),'Updating...',()=>{
const arr=users().map(x=>x.phone===cur.phone?{...x,password:n}:x);
write('users',arr);write('currentUser',{...cur,password:n});
$('#pw-form').reset();$('#pw-msg').innerHTML='<p class="rounded bg-green-50 p-2 text-[12px] text-green-700">Password updated</p>';addNotif('Your password was changed successfully');toast('Password changed');});};
$('#del-acct').onclick=()=>{
showModal(`<h3 class="text-[18px] font-extrabold text-[#0a1931]">Are you sure you want to delete your account?</h3>
<p class="mt-2 text-[13px] leading-6 text-[#475569]">This cannot be undone. Your profile, wallet balance and assignments on this device will be permanently removed.</p>
<label class="mt-4 block text-[13px] font-semibold text-[#0a1931]">Please tell us why you are leaving <span class="text-red-600">(required)</span>
<textarea id="del-reason" rows="3" class="mt-2 w-full rounded-xl border-[1.5px] border-[#e2e8f0] bg-[#f8fafc] p-3 text-[14px] leading-6 text-[#0a1931] focus:border-[#0a1931] focus:outline-none" placeholder="Your feedback helps us improve..."></textarea></label>
<div class="mt-5 flex gap-3"><button id="del-cancel" class="flex-1 rounded-xl border-[1.5px] border-[#e2e8f0] py-3 text-[14px] font-bold text-[#0a1931]">Cancel</button><button id="del-confirm" disabled class="flex-1 rounded-xl bg-red-600 py-3 text-[14px] font-bold text-white opacity-50">Delete Account</button></div>`);
$('#del-cancel').onclick=closeModal;
const ta=$('#del-reason'),cf=$('#del-confirm');
ta.oninput=()=>{const ok=ta.value.trim().length>0;cf.disabled=!ok;cf.classList.toggle('opacity-50',!ok);};
cf.onclick=()=>{
const reason=ta.value.trim();if(!reason)return;
const cur=user();
const done=btnLoading(cf,'Deleting account...');cf.classList.remove('opacity-50');
$('#del-cancel').disabled=true;
setTimeout(()=>{
done();
addAdminLog({fullName:cur.fullName,phone:cur.phone,schoolName:cur.schoolName||'',department:cur.department||''},reason);
write('users',users().filter(x=>x.phone!==cur.phone));
['wallet_','paga_','avatar_','notif_','nsettings_'].forEach(p=>localStorage.removeItem(p+cur.phone));const deleteId=String(cur.username||cur.id||cur.email||cur.phone||'').trim();if(deleteId){localStorage.removeItem(`unieveryhelp_draft_${deleteId}`);localStorage.removeItem(`unieveryhelp_pending_${deleteId}`);}
showModal(`<div class="flex flex-col items-center py-4 text-center"><span class="grid h-16 w-16 place-items-center rounded-full bg-green-100 text-green-600">${ic('check','w-8 h-8')}</span><h3 class="mt-4 text-[18px] font-extrabold text-[#0a1931]">Account successfully deleted</h3><p class="mt-2 text-[13px] text-[#64748b]">Redirecting you to the homepage...</p></div>`);
toast('Account successfully deleted');
setTimeout(()=>{['currentUser','isLoggedIn','lastActivity'].forEach(k=>localStorage.removeItem(k));clearTimeout(inactTimer);closeModal();go('/');},2000);
},3000);
};
};
}
/* ================= HELP & SUPPORT ================= */
function support(){
const all=items();
const opts=all.length?all.map(a=>`<option value="${esc(a.id)}">${esc(a.title)} (${esc(a.courseCode)})</option>`).join(''):'<option value="">No assignments yet</option>';
shell(`<h1 class="text-[26px] font-extrabold text-[#0a1931]">Help &amp; Support</h1>
<p class="mt-1 text-[14px] text-[#64748b]">We are here to help. Reach us or report an issue below.</p>
<div class="mt-6 grid gap-5 lg:grid-cols-2">
<div class="rounded-2xl border-[1.5px] border-[#e2e8f0] bg-white p-6">
<div class="text-[15px] font-bold text-[#0a1931]">Contact Us Direct</div>
<p class="mt-2 text-[13px] leading-6 text-[#64748b]">Chat with our team on WhatsApp for the fastest response.</p>
<a href="https://wa.me/${WA}?text=${encodeURIComponent('Hello Unieveryhelp team, I need help.')}" target="_blank" class="mt-4 flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-[#22c55e] text-[15px] font-bold text-white hover:bg-[#16a34a]">${ic('message','w-5 h-5')}Ask Our Team</a>
<a href="mailto:${SUPPORT_EMAIL}" class="mt-3 flex items-center justify-center gap-2 rounded-xl border-[1.5px] border-[#e2e8f0] py-3 text-[14px] font-semibold text-[#0a1931]">${SUPPORT_EMAIL}</a>
</div>
<div class="rounded-2xl border-[1.5px] border-[#e2e8f0] bg-white p-6">
<div class="text-[15px] font-bold text-[#0a1931]">Report an Issue</div>
<div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
<button id="rep-refund" class="rounded-xl border-[1.5px] border-[#fecaca] bg-[#fef2f2] px-4 py-3 text-[13px] font-bold text-red-600">Request Refund (Assignment Not Done)</button>
<button id="rep-delay" class="rounded-xl border-[1.5px] border-[#fde68a] bg-[#fffbeb] px-4 py-3 text-[13px] font-bold text-[#b45309]">Report Delayed Assignment</button>
</div>
<form id="rep-form" class="mt-4 space-y-4">
<input type="hidden" id="rep-type" value="">
<div id="rep-type-label" class="hidden rounded-xl bg-[#f8fafc] px-4 py-2 text-[13px] font-semibold text-[#0a1931]"></div>
<label class="block"><span class="mb-1.5 block text-[13px] font-semibold text-[#0a1931]">Assignment</span>
<select id="rep-assign" class="h-[52px] w-full rounded-xl border-[1.5px] border-[#e2e8f0] bg-[#f8fafc] px-4 text-[14px] text-[#0a1931] focus:border-[#0a1931] focus:outline-none">${opts}</select></label>
<label class="block"><span class="mb-1.5 block text-[13px] font-semibold text-[#0a1931]">Describe the issue</span>
<textarea id="rep-msg" rows="4" class="w-full rounded-xl border-[1.5px] border-[#e2e8f0] bg-[#f8fafc] p-4 text-[14px] leading-6 text-[#0a1931] focus:border-[#0a1931] focus:outline-none" placeholder="Tell us what went wrong..."></textarea></label>
<button class="btn w-full" type="submit">Submit Report</button>
</form>
</div>
</div>`);
const setType=(v,label,cls)=>{$('#rep-type').value=v;const l=$('#rep-type-label');l.textContent=label;l.className='rounded-xl px-4 py-2 text-[13px] font-semibold '+cls;};
$('#rep-refund').onclick=()=>setType('refund','Selected: Request Refund (Assignment Not Done)','bg-[#fef2f2] text-red-600');
$('#rep-delay').onclick=()=>setType('delay','Selected: Report Delayed Assignment','bg-[#fffbeb] text-[#b45309]');
$('#rep-form').onsubmit=e=>{e.preventDefault();
const type=$('#rep-type').value;if(!type)return toast('Choose an issue type first');
const aid=$('#rep-assign').value,msg=$('#rep-msg').value.trim();
if(!msg)return toast('Please describe the issue');
const reports=read('reports',[]);reports.unshift({id:'r-'+Date.now(),user:uid(),type,assignmentId:aid,message:msg,time:Date.now()});write('reports',reports);
addNotif('Your '+(type==='refund'?'refund request':'delay report')+' has been received. Our team will review it shortly.');
$('#rep-form').reset();$('#rep-type').value='';$('#rep-type-label').className='hidden';
toast('Report submitted. We will get back to you.');};
}
/* ================= AUTH / SESSION ================= */
function guard(){const active=user()||read('unieveryhelp_user',null);if(active&&!user())write('currentUser',active);if(active&&read('isLoggedIn',false)!==true)write('isLoggedIn',true);return !!active&&read('isLoggedIn',false)===true;}
function installHistoryGuard(){history.pushState({protected:true},'',location.href);window.onpopstate=()=>{if(!guard()){location.replace('/');return;}history.pushState({protected:true},'',location.href);};}
function doLogout(){
  const active=user()||read('unieveryhelp_user',null);const id=String(active?.username||active?.id||active?.email||active?.phone||'').trim();if(id){localStorage.removeItem(`unieveryhelp_draft_${id}`);localStorage.removeItem(`unieveryhelp_pending_${id}`);}['currentUser','isLoggedIn','lastActivity'].forEach(k=>localStorage.removeItem(k));sessionStorage.clear();clearTimeout(inactTimer);fetch('/api/demo-session',{method:'DELETE',keepalive:true}).finally(()=>location.replace('/'));
  }
let inactTimer;
const INACT_MS=25*60*1000;
function resetInactivity(){
clearTimeout(inactTimer);
if(guard()){
write('lastActivity',Date.now());
inactTimer=setTimeout(()=>{doLogout();toast('Logged out due to inactivity');},INACT_MS);
}
}
['click','keydown','mousemove','touchstart','scroll'].forEach(ev=>addEventListener(ev,resetInactivity,{passive:true}));
/* ================= ROUTER ================= */
const PROTECTED=['/dashboard','/my-assignments','/wallet','/notifications','/messages','/courses','/settings','/project-support'];
function render(){const p=path();
closeModal();
if(p==='/') return welcome();
if(p==='/create-account') return auth(true);
if(p==='/login') return auth(false);
const isProt=PROTECTED.includes(p)||p.startsWith('/my-assignments/')||p.startsWith('/messages/')||p.startsWith('/courses/');
if(isProt){
if(!guard()){return auth(false);}
installHistoryGuard();
resetInactivity();
}
if(p==='/dashboard') return dashboard();
if(p==='/my-assignments') return list();
if(p==='/my-assignments/new') return newAssignment();
if(p.startsWith('/my-assignments/')) return detail(p.split('/')[2]);
if(p==='/wallet') return wallet();
if(p==='/notifications') return notifications();
if(p==='/messages') return messages();
if(p.startsWith('/messages/')) return chat(decodeURIComponent(p.split('/')[2]));
if(p==='/courses') return courses();
if(p.startsWith('/courses/')) return courseDetail(decodeURIComponent(p.split('/')[2]));
if(p==='/settings') return settings();
if(p==='/project-support') return support();
welcome();
}
(function initSession(){
applyTheme();
if(guard()){
const last=Number(read('lastActivity',0));
if(last&&Date.now()-last>INACT_MS){['currentUser','isLoggedIn','lastActivity'].forEach(k=>localStorage.removeItem(k));}
}
seedStaff();
checkAndDeleteExpiredFiles();
setInterval(checkAndDeleteExpiredFiles,60*60*1000);
})();
addEventListener('hashchange',render);
render();
})();
</script>
<script src="/student-bridge.js" defer></script>
</body>
</html>
